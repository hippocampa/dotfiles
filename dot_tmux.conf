# tmux configuration file
# Place this file at ~/.tmux.conf

# Change prefix key from C-b to C-a (more convenient)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse support
set -g mouse on

# Set 256 color terminal
set -g default-terminal "screen-256color"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 10000

# Enable activity alerts
setw -g monitor-activity on
set -g visual-activity on

# Faster command sequences (no delay)
set -s escape-time 0

# Aggressive resize (useful when sharing sessions)
setw -g aggressive-resize on

# ============================================================================
# KEY BINDINGS
# ============================================================================

# Reload config file
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Split panes with | and - (more intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navigate panes with vim-like keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with vim-like keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window selection
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Create new window in current directory
bind c new-window -c "#{pane_current_path}"

# Copy mode with vim keys
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# Easy copy to system clipboard (requires xclip on Linux or pbcopy on macOS)
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# Quick pane synchronization toggle
bind S setw synchronize-panes

# ============================================================================
# STATUS BAR
# ============================================================================

# Status bar colors
set -g status-bg black
set -g status-fg white

# Status bar position
set -g status-position bottom

# Status bar content
set -g status-left-length 20
set -g status-right-length 50
set -g status-left '#[fg=green][#S] '
set -g status-right '#[fg=yellow]%Y-%m-%d #[fg=cyan]%H:%M #[fg=green]#H'

# Window status format
set -g window-status-format ' #I:#W#F '
set -g window-status-current-format ' #[fg=black,bg=cyan]#I:#W#F #[default]'

# Pane border colors
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour39

# Message colors
set -g message-style bg=colour166,fg=colour232


# ============================================================================
# ADDITIONAL USEFUL SETTINGS
# ============================================================================

# Don't rename windows automatically
set-option -g allow-rename off

# Set window notifications
setw -g monitor-activity on
set -g visual-activity on

# Enable focus events
set -g focus-events on

# Set terminal title
set -g set-titles on
set -g set-titles-string '#T - #I:#W'

# ============================================================================
# PLUGINS (Optional - requires tmux plugin manager)
# ============================================================================

# List of plugins (uncomment to use)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
